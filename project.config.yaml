# ==============================================================================
# Autonomous 30-Day Project Builder Agent Configuration
# Project: ClarifySQL — Text-to-SQL with a Clarification Engine
# ==============================================================================

# Project Metadata
project_name: "ClarifySQL: Text-to-SQL with a Clarification Engine"
project_description: "A production-minded, portfolio-quality application that converts natural-language questions into accurate SQL queries, detects ambiguity, asks users targeted clarification questions, validates generated SQL, executes safe read-only queries, and presents results in an interactive interface."
project_goals:
  - "Build an intelligent ambiguity-detection engine that asks concise, targeted clarification questions only when necessary"
  - "Implement schema-aware, hallucination-free SQL generation with full dialect and relationship support"
  - "Enforce multi-layered SQL security: AST parsing, read-only restriction (SELECT/CTEs only), timeout enforcement, and parameterized limits"
  - "Provide stateful multi-turn conversation memory preserving questions, clarification options, and user choices"
  - "Deliver high-performance FastAPI backend with synthetic PostgreSQL/SQLite domain data (customers, orders, products)"
  - "Build interactive React + Tailwind CSS web dashboard displaying chat history, SQL previews, data tables, and AI explanations"

tech_stack:
  language: "Python & TypeScript"
  runtime: "Python 3.12+ / Node.js 20+"
  frameworks:
    - "FastAPI"
    - "Pydantic v2"
    - "SQLAlchemy / SQLite / PostgreSQL"
    - "React"
    - "Tailwind CSS"
    - "Pytest"
  toolchain:
    test_command: "python -m pytest tests/ -v --tb=short"
    lint_command: "python -m compileall -q ."
    build_command: ""

# Repository and Git Automation (Target Project: Repo B)
repository_url: "https://github.com/VamshiMudiraj05/Text-to-SQL"
base_branch: "main"
target_workspace: "workspace/Text-to-SQL"

# Schedule Settings (IST = UTC+5:30 -> 6:17 AM IST is 00:47 UTC)
timezone: "Asia/Kolkata"
daily_run_time: "06:17"
project_start_date: "2026-10-24"
project_duration_days: 30

# Automation Gates and Rules
daily_commit_enabled: true
daily_push_enabled: true
run_tests_before_commit: true
require_meaningful_changes: true
max_retries: 3
daily_execution_timeout_minutes: 25

# Model Provider Settings (API keys read via ENV variables)
llm:
  provider: "gemini"               # Options: gemini | openai | anthropic | mock
  model: "gemini-2.5-flash"        # Recommended Google Gemini model
  temperature: 0.2
  max_output_tokens: 4096

# Notifications (Optional)
notifications:
  notification_email: ""
  notification_webhook: ""
  notify_on_success: true
  notify_on_failure: true
