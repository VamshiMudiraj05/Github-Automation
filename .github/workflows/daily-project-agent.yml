name: "Autonomous 30-Day Project Agent (Daily 6:00 PM IST)"

on:
  schedule:
    # 18:00 IST (Asia/Kolkata, UTC+5:30) = 12:30 UTC every single day
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      day_override:
        description: 'Specific milestone day to execute (1-30). Leave empty for next pending day.'
        required: false
        default: ''
      dry_run:
        description: 'Dry run without committing or pushing (true/false)'
        type: boolean
        required: false
        default: false
      force:
        description: 'Force run even if milestone is marked completed (true/false)'
        type: boolean
        required: false
        default: false

# Prevent concurrent runs from clashing
concurrency:
  group: autonomous-project-agent-daily
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  execute-daily-milestone:
    name: "Execute Daily Milestone & GitHub Push"
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: "Checkout Repository with Full History"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Configure Git Identity"
        run: |
          git config user.name "${{ github.actor || 'autonomous-project-agent[bot]' }}"
          git config user.email "${{ github.actor || 'agent' }}@users.noreply.github.com"

      - name: "Set up Python Environment"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: "Execute Daily Agent Milestone"
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gemini-3.5-flash' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          NOTIFICATION_WEBHOOK: ${{ secrets.NOTIFICATION_WEBHOOK }}
          DAY_OVERRIDE: ${{ github.event.inputs.day_override }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          ARGS=""
          if [ -n "$DAY_OVERRIDE" ]; then
            ARGS="$ARGS --day $DAY_OVERRIDE"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "$FORCE" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          echo "Executing: python main.py run $ARGS"
          python main.py run $ARGS

      - name: "Upload Execution Reports and State Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-reports-and-state
          path: |
            reports/daily/
            state/
            logs/
          retention-days: 60
